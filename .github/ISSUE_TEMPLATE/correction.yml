name: Report a catalog correction
description: Report an inaccurate record, status observation, accessibility barrier, or source change.
title: "[Correction] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the catalog. Do not include personal, confidential, credential, or legally sensitive information in this public form. Security vulnerabilities belong in a private security advisory.

  - type: input
    id: identifier
    attributes:
      label: Catalog identifier
      description: Provide the dataset or distribution ID when one is shown.
      placeholder: delaware-source-id
    validations:
      required: false

  - type: textarea
    id: current
    attributes:
      label: What appears to be incorrect or inaccessible?
      description: Quote or summarize the catalog statement, link, status, or barrier.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: What should change?
      description: Give the correction or improvement in plain language.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting public evidence
      description: Link to the publisher, documentation, replacement source, or another authoritative reference.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Why does this matter?
      description: Tell us who may be affected or how the issue changes interpretation or access.
    validations:
      required: false

  - type: checkboxes
    id: public
    attributes:
      label: Public information check
      options:
        - label: I have not included private data, credentials, or sensitive personal information.
          required: true

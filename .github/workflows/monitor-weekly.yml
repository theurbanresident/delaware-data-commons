name: Weekly public endpoint monitor

on:
  schedule:
    # Wednesday morning in Delaware; an off-hour minute reduces scheduler load.
    - cron: "17 10 * * 3"
  workflow_dispatch:

# This collection job never receives repository write access or project secrets.
permissions: {}

concurrency:
  group: public-endpoint-monitor
  cancel-in-progress: false

jobs:
  collect:
    name: Collect bounded status observations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out reviewed targets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -p "test_monitor.py" -v

      - name: Generate public current and archive targets
        run: >-
          python -m monitoring.generate_targets
          --catalog catalog/reviewed-intake.json
          --output build/targets-weekly.json

      - name: Collect weekly observations
        env:
          PROJECT_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python -m monitoring.monitor \
            --input build/targets-weekly.json \
            --output build/status-weekly.json \
            --timeout 15 \
            --max-bytes 65536 \
            --max-redirects 5 \
            --retries 2 \
            --user-agent "Delaware-Public-Data-Monitor/0.1 (+https://github.com/$PROJECT_REPOSITORY)"

      - name: Add result summary
        shell: bash
        run: >-
          python -m monitoring.summary build/status-weekly.json
          --title "Weekly public endpoint monitor"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Retain status artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-status-${{ github.run_id }}
          path: build/status-weekly.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

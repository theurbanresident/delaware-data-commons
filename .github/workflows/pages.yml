name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment is deliberately gated. Set repository variable
# ENABLE_GITHUB_PAGES=true only after Pages is configured for GitHub Actions.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.13.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and verify codebook outputs
        shell: bash
        run: |
          npm run codebooks:build
          git diff --exit-code -- catalog/codebooks.json catalog/variable-crosswalk.json public/data/codebooks.json public/data/concept-taxonomy.json public/data/variable-crosswalk.json

      - name: Rebuild and verify prompt guide output
        shell: bash
        run: |
          npm run prompts:build
          git diff --exit-code -- public/data/prompt-guides.json

      - name: Lint site
        run: npm run lint

      - name: Build and test site
        run: npm test
        env:
          # Defaults target a GitHub project site. Set these repository
          # variables to non-empty alternatives when using a custom path/domain.
          PAGES_ASSET_PREFIX: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXT_PUBLIC_GITHUB_REPOSITORY_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}

      - name: Verify static entry point
        shell: bash
        env:
          EXPECTED_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
          EXPECTED_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          EXPECTED_REPOSITORY_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          test -f dist/client/index.html
          grep -Fq "$EXPECTED_BASE_PATH/_next/" dist/client/index.html
          grep -Fq "$EXPECTED_SITE_URL" dist/client/index.html
          grep -Fq "$EXPECTED_REPOSITORY_URL/issues/new" dist/client/contribute.html
          test -d dist/client/_next/static
          asset_prefix="${EXPECTED_BASE_PATH%/}"
          if [ -n "$asset_prefix" ]; then
            test ! -d "dist/client$asset_prefix/_next"
          fi

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/client

  deploy:
    name: Deploy static site
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Pull-request code runs without credentials beyond read-only repository access.
permissions: {}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-and-monitor:
    name: Catalog and monitor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Parse machine-readable source files
        shell: bash
        run: |
          python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('schemas').glob('*.json')]"
          python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in [pathlib.Path('catalog/reviewed-intake.json'), pathlib.Path('catalog/codebooks.json'), pathlib.Path('catalog/concept-taxonomy.json'), pathlib.Path('catalog/variable-crosswalk.json'), pathlib.Path('catalog/prompt-guides.json'), pathlib.Path('catalog/delaware-open-data.json')]]"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate the reviewed intake contract
        shell: bash
        run: |
          python -c "import json, pathlib; from jsonschema import Draft202012Validator, FormatChecker; schema=json.loads(pathlib.Path('schemas/reviewed-intake.schema.json').read_text(encoding='utf-8')); data=json.loads(pathlib.Path('catalog/reviewed-intake.json').read_text(encoding='utf-8')); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"
          python -c "import json, pathlib; from jsonschema import Draft202012Validator, FormatChecker; schema=json.loads(pathlib.Path('schemas/codebooks.schema.json').read_text(encoding='utf-8')); data=json.loads(pathlib.Path('catalog/codebooks.json').read_text(encoding='utf-8')); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"
          python -c "import json, pathlib; from jsonschema import Draft202012Validator, FormatChecker; schema=json.loads(pathlib.Path('schemas/variable-crosswalk.schema.json').read_text(encoding='utf-8')); data=json.loads(pathlib.Path('catalog/variable-crosswalk.json').read_text(encoding='utf-8')); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"
          python -c "import json, pathlib; from jsonschema import Draft202012Validator, FormatChecker; schema=json.loads(pathlib.Path('schemas/prompt-guides.schema.json').read_text(encoding='utf-8')); data=json.loads(pathlib.Path('catalog/prompt-guides.json').read_text(encoding='utf-8')); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"

      - name: Run offline monitor tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate and validate public monitor targets
        shell: bash
        run: |
          python -m monitoring.generate_targets \
            --catalog catalog/reviewed-intake.json \
            --output "$RUNNER_TEMP/targets.json"
          python -c "import os; from pathlib import Path; from monitoring.monitor import load_endpoints; endpoints = load_endpoints(Path(os.environ['RUNNER_TEMP']) / 'targets.json'); assert endpoints, 'catalog generated no public monitor targets'; print(f'validated {len(endpoints)} public monitor targets')"

  site:
    name: Site lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.13.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and verify codebook outputs
        shell: bash
        run: |
          npm run codebooks:build
          git diff --exit-code -- catalog/codebooks.json catalog/variable-crosswalk.json public/data/codebooks.json public/data/concept-taxonomy.json public/data/variable-crosswalk.json

      - name: Rebuild and verify prompt guide output
        shell: bash
        run: |
          npm run prompts:build
          git diff --exit-code -- public/data/prompt-guides.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
